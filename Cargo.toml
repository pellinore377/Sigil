[workspace]
members = ["core", "crypto", "protocol", "server", "client", "android", "text", "media", "maps", "calls", "vendor/ece-native"]
default-members = ["crypto", "protocol", "server", "client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
ece-native = { path = "vendor/ece-native" }

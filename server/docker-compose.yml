# First run:  docker compose run --rm sigil --config /data/sigil.toml init --hostname sigil.example
# then edit ./data/sigil.toml (tls_cert and tls_key, or leave them out behind a
# reverse proxy that terminates TLS) and:  docker compose up -d
# Invite codes: docker compose run --rm sigil --config /data/sigil.toml invite
# Everything the server keeps lives in ./data next to this file.
services:
  sigil:
    build:
      context: ..
      dockerfile: server/Dockerfile
    # Host ports come from server/.env when the defaults are taken:
    #   SIGIL_PORT=18443        # NPM or your proxy forwards to this one
    #   SIGIL_MEDIA_PORT=8444   # calls; forward this UDP port on the router and
    #                           # put it in media_public in sigil.toml
    ports:
      - "${SIGIL_PORT:-8443}:8443"
      - "${SIGIL_MEDIA_PORT:-8444}:8444/udp"
    volumes:
      - ./data:/data
    # devices:
    #   - /dev/tpmrm0:/dev/tpmrm0   # recovery Path 2, when implemented
    restart: unless-stopped

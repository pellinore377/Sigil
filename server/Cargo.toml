[package]
name = "sigil-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sigil-crypto = { path = "../crypto" }
sigil-protocol = { path = "../protocol" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["timeout", "limit"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "backup"] }
serde_json.workspace = true
getrandom = "=0.4.3"
sha2 = "=0.10.9"
subtle = "=2.6.1"
serde.workspace = true
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }
zeroize = { version = "=1.9.0", features = ["serde"] }
web-push-native = { version = "=0.5.0", default-features = false }
ring = "=0.17.14"
base64ct = { version = "=1.8.3", features = ["alloc"] }
httpdate = "=1.0.3"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tempfile = "=3.27.0"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }

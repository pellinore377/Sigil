name: Server image
# Routine development builds run on the server host via ./deploy-server.sh; this
# hosted build is for published releases, so it runs only when asked.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: |
            ghcr.io/pellinore377/sigil:latest
            ghcr.io/pellinore377/sigil:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/pellinore377/Sigil
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container
        env:
          IMAGE: ghcr.io/pellinore377/sigil:${{ github.sha }}
        run: |
          set -eu
          trap 'docker rm -f sigil-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name sigil-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /var/lib/sigil/data:uid=65532,gid=65532,mode=700 \
            -p 127.0.0.1:18780:8080 "$IMAGE"
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec sigil-smoke /usr/local/bin/sigil-server healthcheck; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          for path in /admin /messenger /web/sigil-notifications.mjs /web/sigil_browser_bg.wasm; do
            curl --fail --silent --show-error "http://127.0.0.1:18780$path" -o /dev/null
          done
      - name: Publish
        run: |
          docker push ghcr.io/pellinore377/sigil:${{ github.sha }}
          docker push ghcr.io/pellinore377/sigil:latest

[package]
name = "sigil-slint"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "Sigil's Slint frontend: one UI over the in-process engine, for Android first and every other platform after"
build = "build.rs"

# cdylib for cargo-apk's NativeActivity loader; rlib for the desktop binary.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sigil-slint"
path = "src/main.rs"

[dependencies]
slint = "1.17"
# The engine linked directly — no daemon, no socket, no bindings layer.
# `calls` is off for the same reason as android/build-engine.sh: no libwebrtc here yet.
sigil-engine = { path = "../core", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
png = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }
# android-activity needs exactly one activity flavour chosen by the final crate.
android-activity = { version = "0.6", features = ["native-activity"] }
# Opening the login URL means one JNI call; there is no xdg-open on a phone.
jni = "0.21"
ndk-context = "0.1"
tracing-android = "0.2"

[build-dependencies]
slint-build = "1.17"

[package.metadata.android]
package = "com.sigil.slint"
apk_name = "sigil-slint"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
compile_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[package.metadata.android.application]
label = "Sigil"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"

# Dev signing: the adb debug keystore. A real release key comes with real releases.
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"

[package]
name = "sigil-slint"
version = "0.1.4"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "Sigil's Slint frontend: one UI over the in-process engine, for Android first and every other platform after"
build = "build.rs"

# cdylib for cargo-apk's NativeActivity loader; rlib for the desktop binary.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sigil-slint"
path = "src/main.rs"

[dependencies]
slint = { version = "1.17", features = ["unstable-fontique-010"] }
# The engine linked directly — no daemon, no socket, no bindings layer.
# `calls` is off for the same reason as android/build-engine.sh: no libwebrtc here yet.
sigil-engine = { path = "../core", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
png = "0.18"
# The engine's OMV1 video surface is mapped, not read: src/video.rs.
memmap2 = "0.9"
# The link offer as a QR code, drawn into a Slint image; no image crate needed.
qrcode = { version = "0.14", default-features = false }
# The screenshot harness writes a real animated GIF for the engine to decode.
# Same crate and version the engine already links, with a feature it already
# turns on, so cargo unifies it and nothing new rides into the binary.
# png/jpeg/webp: the timeline's pictures are decoded off the UI thread
# (bridge.rs avatar_thumb), at timeline size, instead of by the renderer on
# the frame that first draws them.
image = { version = "0.25", default-features = false, features = ["gif", "png", "jpeg", "webp"] }
# gvar-alloc: Google Sans Flex has more than the 32 variation tuples ttf-parser
# keeps on the stack, and without this feature every outline_glyph on it
# silently returns None. See shared/fonts/README.md.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
# the call media stack: the WebRTC peer, sound in and out, the codec
str0m = "0.9"
cpal = "0.15"
opus = "0.3"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = "=1.17.1"

# `log`: Slint's own messages (the `perf` frame report among them) through
# the `log` crate, which android_logger carries to logcat; otherwise they go
# to stderr, which the phone never shows.
slint = { version = "1.17", features = ["backend-android-activity-06", "log", "unstable-fontique-010"] }
# android-activity needs exactly one activity flavour chosen by the final crate.
android-activity = { version = "0.6", features = ["native-activity"] }
# Opening the login URL means one JNI call; there is no xdg-open on a phone.
jni = "0.21"
ndk-context = "0.1"
tracing-android = "0.2"
# Slint's own frame-time report (the `perf` device flag) speaks the `log`
# crate; without a backend it went nowhere on the phone.
android_logger = "0.14"
log = "0.4"
# The runtime's log handler (its frame-time report under the `perf` flag),
# reached directly: the `log` route above never showed on the device.
i-slint-core = "1.17"

[build-dependencies]
slint-build = "1.17"
# javac and d8 for java/SigilFilePicker.java, only when the target is Android.
# The same crate and the same version the Slint Android backend builds its own
# Java helper with, so one toolchain serves both.
android-build = "0.1.2"

[package.metadata.android]
package = "com.sigil.slint"
apk_name = "sigil-slint"
build_targets = ["aarch64-linux-android"]
# The Java that the SYSTEM instantiates by name — the foreground service and
# the notification actions' broadcast receiver — cannot come from the
# in-memory dex platform.rs loads for the camera and the file picker: a
# manifest component is built by the app's own class loader. build.rs writes
# the same dex here for cargo-apk to pack into the APK.
dex = "target/java/classes.dex"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
compile_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# Calls: the microphone. Android grants it per app from Settings until the
# app asks for it itself (Phase 8, permissions through the activity).
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

# The in-app viewfinder (java/SigilCamera.java). The old camera tile handed
# the job to whatever camera app the phone had, which needs no permission of
# ours; opening the sensor ourselves does. Runtime grant on targetSdk 35 —
# platform.rs asks through the Activity, together with RECORD_AUDIO above,
# which the same page needs the moment it records a clip.
[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

# The gallery sheet under the viewfinder (java/SigilCamera.java) shows the
# device's own recent pictures and clips, which is a MediaStore read. API 33
# split the old blanket read into one grant per medium and stopped granting
# the blanket one at all, so both shapes are declared and the old one is
# capped at the last level that had it. All three are asked for together with
# CAMERA (platform.rs); Android ignores whichever does not apply, and a
# refusal is an empty sheet rather than a camera that will not open.
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

# Notifications. POST_NOTIFICATIONS is the runtime grant API 33 introduced —
# before it, an app could post unasked; from it, a refusal means the shade
# stays empty and nothing else changes. platform.rs asks through the Activity
# the first time a session comes up, exactly as the camera does.
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

# The foreground service (java/SigilService.java) that keeps this process —
# and with it the engine's Envoy socket — alive while the app is in the
# background; without it Android freezes the process and the message that
# should have rung never arrives. From API 34 the service's TYPE must be
# permitted separately, and remoteMessaging is the one this case is named
# after; the type is declared again on the service entry below, and the two
# must agree or the service refuses to start.
[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING"

# Position: the engine's own ladder starts at android.location.LocationManager
# (core/src/geo/android.rs). Both are runtime grants on targetSdk 35 — the
# engine asks through the Activity handed to it in android_main; the coarse
# one is declared alongside because Android refuses a fine-only request.
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_FINE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_COARSE_LOCATION"

[package.metadata.android.application]
label = "Sigil"
# The identity keys must never ride a cloud backup: a reinstall on this
# package restored the whole account from Google's backup unasked.
allow_backup = false
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

# java/SigilService.java. Not exported: SigilNotify starts it by explicit
# component and nothing outside the app has any business with it.
[[package.metadata.android.application.service]]
name = "com.sigil.slint.SigilService"
exported = false
foreground_service_type = "remoteMessaging"

# java/SigilReceiver.java: Reply and Mark as read under a notification. Not
# exported either — every PendingIntent that reaches it names the component.
[[package.metadata.android.application.receiver]]
name = "com.sigil.slint.SigilReceiver"
exported = false

# Symbols too: the Android library is 98 MB with them and 69 MB without,
# and the difference is what puts the APK under the 30 MB most channels
# accept. Backtraces on a phone come from logcat, not from symbols anyway.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Dev signing: a copy of (or symlink to) the adb debug keystore,
# ~/.android/debug.keystore, placed next to this file; it is not committed.
# A real release key comes with real releases (Phase 8 of the port plan).
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"

# The runtime with our fix for long-press inside Flickables on touch
# (vendor/i-slint-core carries a SIGIL PATCH in input.rs; the report to
# send upstream is UPSTREAM-flickable-longpress.md).
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }
# SIGIL PATCH in opengl_surface.rs: a stencil buffer for the GL surface, so
# Skia clips the bubbles' mixed-radius corners on the GPU.
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }

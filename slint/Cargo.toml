[package]
name = "sigil-slint"
version = "0.1.2"
edition = "2021"
license = "LicenseRef-Proprietary"
description = "Sigil's Slint frontend: one UI over the in-process engine, for Android first and every other platform after"
build = "build.rs"

# cdylib for cargo-apk's NativeActivity loader; rlib for the desktop binary.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sigil-slint"
path = "src/main.rs"

[dependencies]
slint = "1.17"
# The engine linked directly — no daemon, no socket, no bindings layer.
# `calls` is off for the same reason as android/build-engine.sh: no libwebrtc here yet.
sigil-engine = { path = "../core", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
png = "0.18"
# The link offer as a QR code, drawn into a Slint image; no image crate needed.
qrcode = { version = "0.14", default-features = false }
ttf-parser = "0.25"
# the call media stack: the WebRTC peer, sound in and out, the codec
str0m = "0.9"
cpal = "0.15"
opus = "0.3"
chacha20poly1305 = "0.10"
hex = "0.4"
rand = "0.9"

[target.'cfg(target_os = "android")'.dependencies]
i-slint-backend-android-activity = "=1.17.1"

slint = { version = "1.17", features = ["backend-android-activity-06"] }
# android-activity needs exactly one activity flavour chosen by the final crate.
android-activity = { version = "0.6", features = ["native-activity"] }
# Opening the login URL means one JNI call; there is no xdg-open on a phone.
jni = "0.21"
ndk-context = "0.1"
tracing-android = "0.2"

[build-dependencies]
slint-build = "1.17"

[package.metadata.android]
package = "com.sigil.slint"
apk_name = "sigil-slint"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35
compile_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# Calls: the microphone. Android grants it per app from Settings until the
# app asks for it itself (Phase 8, permissions through the activity).
[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

# Position: the engine's own ladder starts at android.location.LocationManager
# (core/src/geo/android.rs). Both are runtime grants on targetSdk 35 — the
# engine asks through the Activity handed to it in android_main; the coarse
# one is declared alongside because Android refuses a fine-only request.
[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_FINE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_COARSE_LOCATION"

[package.metadata.android.application]
label = "Sigil"
# The identity keys must never ride a cloud backup: a reinstall on this
# package restored the whole account from Google's backup unasked.
allow_backup = false
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

# Symbols too: the Android library is 98 MB with them and 69 MB without,
# and the difference is what puts the APK under the 30 MB most channels
# accept. Backtraces on a phone come from logcat, not from symbols anyway.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Dev signing: a copy of (or symlink to) the adb debug keystore,
# ~/.android/debug.keystore, placed next to this file; it is not committed.
# A real release key comes with real releases (Phase 8 of the port plan).
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"

# The runtime with our fix for long-press inside Flickables on touch
# (vendor/i-slint-core carries a SIGIL PATCH in input.rs; the report to
# send upstream is UPSTREAM-flickable-longpress.md).
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-backend-android-activity = { path = "vendor/i-slint-backend-android-activity" }

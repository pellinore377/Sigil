[package]
name = "sigil-maps"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
martin-core = { version = "=0.11.2", default-features = false, features = ["pmtiles"] }
martin-tile-utils = "=0.7.8"
object_store = { version = "=0.14.1", default-features = false, features = ["fs"] }
async-trait = "=0.1.89"
bytes = "=1.12.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = "=0.3.34"
tokio = { version = "=1.53.1", features = ["rt", "sync"] }
serde.workspace = true
serde_json.workspace = true
html2text = { version = "=0.17.1", default-features = false }
html-escape = "=0.2.13"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

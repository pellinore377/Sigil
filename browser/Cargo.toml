[package]
name = "sigil-browser"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
video-acceptance = []

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
zeroize = "=1.9.0"
base64ct = { version = "=1.8.3", features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sigil-client = { path = "../client" }
sigil-crypto = { path = "../crypto" }
sigil-calls = { path = "../calls" }
web-time = "=1.1.0"
serde.workspace = true
serde_json.workspace = true
zeroize = "=1.9.0"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
http = "=1.5.0"
base64ct = { version = "=1.8.3", features = ["alloc"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
futures-channel = "=0.3.34"
sqlite-wasm-vfs = "=0.2.0"
rsqlite-vfs = "=0.1.1"
web-sys = { version = "=0.3.104", features = ["MessageChannel","MessagePort","Geolocation","Position","PositionError","PositionOptions","Coordinates","ImageBitmap","DomParser","SupportedType","NodeList","NamedNodeMap","Attr","MediaRecorder","MediaRecorderOptions","RecordingState","BlobEvent","FilePropertyBag","AudioContext","AudioContextState","AudioNode","AnalyserNode","MediaStreamAudioSourceNode","Blob","BlobPropertyBag","File","FileList","HtmlInputElement","HtmlAnchorElement","Url","Node","BroadcastChannel","History","HtmlVideoElement","HtmlMediaElement","HtmlCanvasElement","CanvasRenderingContext2d","ImageData","Document","Element","HtmlElement","Navigator","MediaDevices","MediaStream","MediaStreamTrack","MediaStreamConstraints","Window","Performance","Worker","WorkerOptions","WorkerType","DedicatedWorkerGlobalScope","WorkerGlobalScope","WorkerNavigator","StorageManager","MessageEvent","Event","EventTarget","ErrorEvent","DomException","IdbFactory","IdbDatabase","IdbObjectStore","IdbOpenDbRequest","IdbRequest","IdbTransaction","IdbTransactionMode","IdbTransactionOptions","IdbTransactionDurability","Crypto","CryptoKey","SubtleCrypto","Request","RequestInit","RequestCache","RequestMode","RequestCredentials","RequestRedirect","Response","Headers","AbortController","AbortSignal","ReadableStream","ReadableStreamDefaultReader","Location","WorkerLocation","Credential","CredentialsContainer","CredentialRequestOptions","CredentialCreationOptions","PublicKeyCredential"] }

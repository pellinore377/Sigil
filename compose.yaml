services:
  sigil:
    image: sigil-backend:f540c4b
    build:
      context: https://github.com/pellinore377/Sigil.git#f540c4b005dee8e80b0dc38d55ef203119cdca77
    platform: linux/amd64
    ports:
      - "18080:8080"
    volumes:
      - sigil-data:/var/lib/sigil
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 2
    stop_grace_period: 10s
    restart: unless-stopped
volumes:
  sigil-data:

services:
  sigil:
    image: ghcr.io/pellinore377/sigil:f540c4b@sha256:789c88d9205a964c27b6f68ab6c20b5dd137b856d29350a72c9500e5d0752802
    platform: linux/amd64
    ports:
      - "18080:8080"
    volumes:
      - sigil-data:/var/lib/sigil
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 2
    stop_grace_period: 10s
    restart: unless-stopped
volumes:
  sigil-data:

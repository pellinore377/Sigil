services:
  sigil:
    image: ghcr.io/pellinore377/sigil:latest
    pull_policy: never
    platform: linux/amd64
    environment:
      SIGIL_LOG_CIPHERTEXT: "false"
    labels:
      # This image is built on the host and never pushed, so the registry copy is always older.
      # An updater that pulls it replaces a working build with one whose schema cannot open the
      # database, and the server then refuses to start at all.
      com.centurylinklabs.watchtower.enable: "false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "18080:8080"
      - "34780:34780/udp"
    volumes:
      - sigil-data:/var/lib/sigil
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 2
    stop_grace_period: 10s
    restart: unless-stopped
volumes:
  sigil-data:

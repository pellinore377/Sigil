[package]
name = "sigil-calls"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
forwarder = ["dep:str0m"]
[dependencies]
sigil-crypto = { path = "../crypto" }
sigil-protocol = { path = "../protocol" }
sframe = { version = "=1.4.3", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
getrandom = "=0.4.3"
zeroize = { version = "=1.9.0", features = ["serde"] }
str0m = { version = "=0.23.1", default-features = false, features = ["aws-lc-rs"], optional = true }

[dev-dependencies]
str0m = { version = "=0.23.1", default-features = false, features = ["aws-lc-rs"] }
webrtc = "=0.20.5"
rtc = "=0.20.5"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
async-trait = "=0.1.89"
bytes = "=1.12.1"
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }

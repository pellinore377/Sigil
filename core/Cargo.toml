[package]
name = "sigil-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
build = "build.rs"
license = "LicenseRef-Proprietary"
description = "Sigil — the client engine: a Sigil account, MLS conversations, media and calls behind a local JSON protocol"

[lib]
name = "sigil_engine"
path = "src/lib.rs"
# cdylib so Android and iOS can link it; rlib so the daemon and examples can.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "sigil-engine"
path = "src/main.rs"

[features]
default = []

[dependencies]
sigil-client = { path = "../client" }
sigil-protocol = { path = "../protocol" }
hex = "0.4"
ruma-html = "0.8"
uniffi = { version = "0.28", features = ["cli"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
clap = { version = "4", features = ["derive"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
hostname = "0.4"
libc = "0.2"
memmap2 = "0.9"
mime = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mime_guess = "2"
# tiff/bmp/ico join the set so the engine can normalise them itself; AVIF,
# HEIC and JPEG XL go through ffmpeg instead of pulling in more C libraries.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp", "ico"] }
# SVG is rasterised here rather than handed to Qt's renderer, which would
# happily follow references inside a document a stranger sent.
resvg = "0.48"
# GeoClue lives on the system bus; this is the only D-Bus we speak.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Document previews, all in-process: no LibreOffice, no pandoc, nothing spawned.
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
calamine = { version = "0.36", features = ["dates"] }
csv = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pdf-extract = "0.12"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }


# MatrixRTC / LiveKit: exact-pinned as a matched set; bump all three together.

hayro = "0.7.1"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy", "parsing"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"
debug = 1
panic = "unwind"

[profile.dev]
opt-level = 1

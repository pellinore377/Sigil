[package]
name = "sigil-client"
version = "0.1.0"
edition = "2021"
description = "Sigil client core: identity, MLS conversations, slots, requests, local store."
license = "UNLICENSED"

[dependencies]
sigil-protocol = { path = "../protocol" }
openmls = "0.6"
openmls_rust_crypto = "0.3"
openmls_basic_credential = "0.3"
openmls_traits = "0.3"
openmls_memory_storage = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rand_core10 = { package = "rand_core", version = "0.10" }
clap = { version = "4", features = ["derive"] }
tls_codec = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
rand = "0.8"
ed25519-dalek = "2"
chacha20poly1305 = "0.10"

[[bin]]
name = "sigil-cli"
path = "src/bin/cli.rs"

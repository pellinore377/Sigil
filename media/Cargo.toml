[package]
name = "sigil-media"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["worker"]
portable = ["dep:calamine", "dep:csv", "dep:zip", "dep:stl_io", "dep:lib3mf", "dep:tiny-skia", "dep:quick-xml"]
worker = ["portable", "dep:pdfium-render", "dep:symphonia"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"], optional = true }
calamine = { version = "=0.36.1", default-features = false, optional = true }
csv = { version = "=1.4.0", optional = true }
symphonia = { version = "=0.6.1", default-features = false, features = ["all-codecs", "all-formats"], optional = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
stl_io = { version = "=0.11.0", optional = true }
lib3mf = { version = "=0.1.6", default-features = false, optional = true }
quick-xml = { version = "=0.41.0", default-features = false, optional = true }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"], optional = true }

[[bin]]
name = "sigil-preview"
path = "src/main.rs"
required-features = ["worker"]

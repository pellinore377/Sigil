[package]
name = "sigil-crypto"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sigil-protocol = { path = "../protocol" }
aes-gcm-siv = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
ml-kem = { version = "=0.3.2", default-features = false, features = ["zeroize"] }
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem1024", "incremental"] }
raptorq = { version = "=2.0.1", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
hkdf = "=0.13.0"
zeroize = "=1.9.0"
getrandom = "=0.4.3"
ed25519-dalek = "=2.2.0"
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
subtle = "=2.6.1"

[dev-dependencies]
sha3 = { version = "=0.11.0", default-features = false }
serde_json.workspace = true

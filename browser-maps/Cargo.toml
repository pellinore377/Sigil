[package]
name = "sigil-browser-maps"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "=1.26.1", features = ["js"] }
galileo-types = { git = "https://github.com/galileo-map/galileo", rev = "42550766d38faca071805f57e7317c5addf1efc3", default-features = false }
galileo-mvt = { git = "https://github.com/galileo-map/galileo", rev = "42550766d38faca071805f57e7317c5addf1efc3" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasWindingRule", "TextMetrics", "Window", "Document", "FontFace", "FontFaceSet"] }
serde_json = "=1.0.151"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

[profile.release]
lto = "thin"
opt-level = "s"
